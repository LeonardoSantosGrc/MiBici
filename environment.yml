name: mibici
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - typer
  - loguru
  - tqdm
  - ipython
  - jupyterlab
  - ipykernel
  - ipywidgets
  - matplotlib
  - notebook
  - numpy
  - pandas
  - scikit-learn
  - ruff
  - pytest
  - python-dotenv
  - mkdocs
  - requests
  - beautifulsoup4
  - mlflow
  - seaborn
  # Model serving: web framework, ASGI server and HTTP client used by the API tests
  - fastapi
  - uvicorn
  - httpx
  # Drift statistics (Kolmogorov-Smirnov test)
  - scipy
  - pip:
    - -e .
